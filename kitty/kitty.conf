# Font
font_family      JetBrains Mono Nerd Font
font_size 11.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (consistency with foot)
window_margin_width 21.75

# No close confirmation
confirm_os_window_close 0

# Use fish shell
shell bash

# Include generated theme colors
include current-theme.conf

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

font_size 13

listen_on unix:/tmp/kitty
shell_integration enabled
allow_remote_control yes

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten '/home/ogios/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'
# Browse scrollback buffer in nvim
map kitty_mod+alt+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output


# adjust_line_height 1
# adjust_column_width 1
# cursor #00ccff

window_padding_width 1
background_opacity  0.7
#background_opacity  0.94

action_alias launch_tab launch --type=tab --cwd=current
map ctrl+shift+n launch_tab

action_alias text send_text normal
map ctrl+shift+h no_op
# map ctrl+shift+alt+h show_scrollback

map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+tab no_op
map ctrl+shift+tab no_op

window_margin_width 6
